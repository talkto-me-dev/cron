name: 重置 Alpha 数据库

env:
  TZ: Asia/Shanghai

on:
  workflow_dispatch:

concurrency:
  group: db-reset-alpha
  cancel-in-progress: false

jobs:
  reset:
    name: 重置数据库与缓存
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
      - name: 环境配置
        uses: ./.github/actions/setup
        with:
          gh_pat: ${{ secrets.GH_PAT }}
      - name: 执行重置
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: cd cron/db_reset_alpha && ./run.sh
