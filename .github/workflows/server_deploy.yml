name: 服务器部署

env:
  TZ: Asia/Shanghai

on:
  workflow_dispatch:
    inputs:
      env:
        description: 目标环境
        required: true
        type: choice
        options: [alpha, prod]

concurrency:
  group: server-deploy-${{ inputs.env }}
  cancel-in-progress: false

jobs:
  backend:
    name: 后端部署
    runs-on: ubuntu-latest
    outputs:
      old_hashes: ${{ steps.run.outputs.old_hashes }}
      new_hashes: ${{ steps.run.outputs.new_hashes }}
      main_host: ${{ steps.run.outputs.main_host }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
      - name: 环境配置
        uses: ./.github/actions/setup
        with:
          gh_pat: ${{ secrets.GH_PAT }}
      - name: 执行部署
        id: run
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          DEPLOY_ENV: ${{ inputs.env }}
        run: cd cron/server_deploy && ./backend.js

  frontend:
    name: 前端部署
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
      - name: 环境配置
        uses: ./.github/actions/setup
        with:
          gh_pat: ${{ secrets.GH_PAT }}
      - name: 执行部署
        env:
          DEPLOY_ENV: ${{ inputs.env }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: cd cron/server_deploy && ./frontend.js

  notify:
    name: 结果通知
    needs: [backend, frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
      - name: 环境配置
        uses: ./.github/actions/setup
        with:
          gh_pat: ${{ secrets.GH_PAT }}
      - name: 发送通知
        env:
          DEPLOY_ENV: ${{ inputs.env }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          OLD_HASHES: ${{ needs.backend.outputs.old_hashes }}
          NEW_HASHES: ${{ needs.backend.outputs.new_hashes }}
          MAIN_HOST: ${{ needs.backend.outputs.main_host }}
        run: cd cron/server_deploy && ./notify.js
